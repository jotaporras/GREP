# @package _global_
# refactor_verify — GraphMask (graph_mask_llm = e8_graph_mask_llm), NO-EDGES arm.
#
# The real structural-adjacency mask (gnn.mask_use_edges=true) with NO textual edge list
# (data.text_edge_list=none): connectivity reaches the model ONLY through the attention mask,
# not the prompt. Paired with rv_gmask_edges (same mask, edges also in text) to isolate the
# textual-edge axis on top of the adjacency mask.
#
#   python -m prism.training.train_v3 --config-name=refactor_verify/rv_gmask_noedges
defaults:
  - /base_config
  - _self_

name: rv_gmask_noedges
gnn:
  arch: graph_mask_llm
  mask_k_hops: 1
  mask_symmetrize: true
  mask_use_edges: true    # mask follows actual adjacency (the graph-mask architecture)
data:
  text_edge_list: none
trainer:
  bit4: true
  epochs: 2
  freeze_llm: false
  checkpoint_dir: outputs/refactor_verify
  overwrite_ok: false
eval:
  data: data/revised/gen/nav100_n30_gemma_data/split/test_graphs/data_gen_023.json
  num_graphs: 1
  post_train_graphs: data/revised/gen/nav100_n30_gemma_data/split/test_graphs
wandb:
  run_name: rv_gmask_noedges
  tag: refactor_verify