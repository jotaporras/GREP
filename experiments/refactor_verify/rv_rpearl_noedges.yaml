# @package _global_
# refactor_verify — RPEARL best variant = e8_rpearl_llm (plain rpearl_llm), NO-EDGES arm.
#
# Identical to rv_rpearl_edges except data.text_edge_list=none (R-PEARL PE only). This is
# the "rpearl with no edges" arm you asked for.
#
#   python -m prism.training.train_v3 --config-name=refactor_verify/rv_rpearl_noedges
defaults:
  - /base_config
  - _self_

name: rv_rpearl_noedges
gnn:
  arch: rpearl_llm
  pe_gain_init: 0.0
data:
  text_edge_list: none
trainer:
  bit4: true
  epochs: 2
  freeze_llm: false
  checkpoint_dir: outputs/refactor_verify
  overwrite_ok: false
eval:
  data: data/revised/gen/nav100_n30_gemma_data/split/test_graphs/data_gen_023.json
  num_graphs: 1
  post_train_graphs: data/revised/gen/nav100_n30_gemma_data/split/test_graphs
wandb:
  run_name: rv_rpearl_noedges
  tag: refactor_verify