# e9 multistage training — STAGE 1: SFT the LLM (LoRA), edges in text, PE frozen.
#
# Pure SFT for a single epoch. The PE module is structurally present (rpearl_llm)
# but FROZEN at init and gated off (pe_gain_init=0), so it contributes nothing and
# trains nothing — this stage only fits the LoRA adapter to the SPINE style. The
# saved adapter is carried into Stage 2 via --init_lora_from.
#
# Run via scripts/e9_multistage_training.sh (chains Stage 1 -> Stage 2).
name: e9_ms_s1
architecture: rpearl_llm
wandb_project: GREP-PRISM
wandb_run_name: e9_ms_stage1_sft
wandb_tag: e9_multistage_training
checkpoint_dir: outputs/e9_multistage_training
data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
val_data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
# Multi-graph eval source (directory) — capped to eval_num_graphs each interval.
eval_data: data/revised/gen/nav100_n30_gemma_data/split/test_graphs
eval_num_graphs: 5
eval_epoch_interval: 1.0
base_model: google/gemma-4-12B-it
# bf16 across ALL stages: Stage 2 (frozen base + frozen adapter, PE-only) cannot
# train under 4-bit, and matching Stages 1/3 to bf16 keeps the carried-forward
# adapter on the same base precision it was trained against.
bit4: false
per_device_train_batch_size: 1
learning_rate: 0.0002
epochs: 1
r: 16
debug: false
dataset_proportion: 1.0
max_seq_length: 8192
text_edge_list: present
# Assistant-only SFT (template-agnostic; supervises only the answer tokens).
loss_target: responses
# Stage-1 freeze regime: train ONLY the LoRA; PE stays inert.
freeze_pe: true
freeze_lora: false
# R-PEARL GNN params (match e8_rpearl_llm).
d_model: 1024
pe_hidden_channels: 256
pe_num_layers: 2
num_samples: 40
dropout: 0.1
k_pe: 2
eps: 1e-6
use_layer_norm: true
pe_gain_init: 0.0
freeze_llm: false
device: -1
