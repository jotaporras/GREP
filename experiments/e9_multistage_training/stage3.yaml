# e9 multistage training — STAGE 3: unfreeze, train PE + LoRA jointly, NO edges.
#
# Launched AFTER analyzing Stage 2. Starts from the Stage-2 checkpoint (which is
# self-contained): --init_lora_from <stage2 dir> reattaches the SFT adapter as
# TRAINABLE and --init_pe_from <stage2 dir> loads the trained PE (incl. its learned
# pe_gain). text_edge_list: none removes the edge bullets from the prompt, so the
# model must rely on the PE for connectivity. One epoch, full-sequence loss.
#
# --init_lora_from / --init_pe_from are supplied by the driver (RUN_STAGE3=1) or by
# hand once you've decided to proceed (both point at the same Stage-2 dir).
name: e9_ms_s3
architecture: rpearl_llm
wandb_project: GREP-PRISM
wandb_run_name: e9_ms_stage3_joint
wandb_tag: e9_multistage_training
checkpoint_dir: outputs/e9_multistage_training
data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
val_data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
eval_data: data/revised/gen/nav100_n30_gemma_data/split/test_graphs
eval_num_graphs: 5
eval_epoch_interval: 1.0
base_model: google/gemma-4-12B-it
bit4: false
per_device_train_batch_size: 1
learning_rate: 0.003
epochs: 3
r: 16
debug: false
dataset_proportion: 1.0
max_seq_length: 8192
# Edge list REMOVED — connectivity must come from the PE now.
text_edge_list: none
# Assistant-only loss, matching Stage 1 and the LLM baselines (fair comparison).
loss_target: responses
# Stage-3 regime: both the carried adapter and the PE train.
freeze_pe: false
freeze_lora: false
# init_lora_from / init_pe_from: <resolved Stage-2 checkpoint dir>  # set by the driver
d_model: 1024
pe_hidden_channels: 256
pe_num_layers: 2
num_samples: 40
dropout: 0.1
k_pe: 2
eps: 1e-6
use_layer_norm: true
pe_gain_init: 0.0
freeze_llm: false
device: -1
