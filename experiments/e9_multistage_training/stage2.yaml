# e9 multistage training — STAGE 2: freeze the SFT'd LLM, train ONLY the PE.
#
# The Stage-1 LoRA adapter is carried forward (--init_lora_from <stage1 dir>) and
# FROZEN (freeze_lora: true); only the PE module trains. The objective is masked to
# the edge-list tokens (loss_target: edge_list), so the encoder is trained as an
# edge-list reconstructor — it must surface adjacency for the (frozen) LLM to emit
# the `• Region Edges:` / `• Object Edges:` bullets. Edges MUST be in the text here
# (text_edge_list: present) so those target tokens exist. "As long as it takes":
# many epochs, no overfit risk (the LLM is fixed). Saved checkpoint is
# self-contained (frozen adapter + trained PE) so it can be evaluated AND fed whole
# into Stage 3.
#
# --init_lora_from is supplied by scripts/e9_multistage_training.sh at runtime.
name: e9_ms_s2
architecture: rpearl_llm
wandb_project: GREP-PRISM
wandb_run_name: e9_ms_stage2_pe
wandb_tag: e9_multistage_training
checkpoint_dir: outputs/e9_multistage_training
data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
val_data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
eval_data: data/revised/gen/nav100_n30_gemma_data/split/test_graphs
eval_num_graphs: 5
# Bound eval cost over the long PE-only run (eval every 2 epochs).
eval_epoch_interval: 2.0
base_model: google/gemma-4-12B-it
bit4: false
per_device_train_batch_size: 1
learning_rate: 0.0002
# "As long as it takes" — generous; bump or pass --max_steps as needed.
epochs: 8
r: 16
debug: false
dataset_proportion: 1.0
max_seq_length: 8192
text_edge_list: present
loss_target: edge_list
# Stage-2 freeze regime: LLM + carried adapter frozen, PE trains.
freeze_pe: false
freeze_lora: true
# init_lora_from: <resolved Stage-1 checkpoint dir>   # set by the driver
d_model: 1024
pe_hidden_channels: 256
pe_num_layers: 2
num_samples: 40
dropout: 0.1
k_pe: 2
eps: 1e-6
use_layer_norm: true
# Zero-init gating (Flamingo / LLaMA-Adapter): keep the gate CLOSED at init so the
# untrained PE doesn't inject full-strength noise into the frozen residual stream
# (which degrades from step 0). The PE still trains: tanh'(0)=1, so pe_gain gets a
# nonzero gradient and moves off zero on step 0, which unlocks the encoder gradient
# from step 1 — a one-step ramp-in, NOT a cold-start trap. (Verified in PyTorch.)
pe_gain_init: 0.0
freeze_llm: false
device: -1
