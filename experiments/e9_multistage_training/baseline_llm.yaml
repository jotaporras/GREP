# e9 reference baseline: plain LLM (LoRA SFT, no graph PE), edges IN the text.
#
# The accuracy reference for the e9 multistage PE model. Same base model / data /
# eval / assistant-only loss as the PE stages, so the only difference vs the
# Stage-3 model is the graph PE. Standalone run (NOT part of the chain driver):
#   python -m prism.training.train_v2 experiments/e9_multistage_training/baseline_llm.yaml \
#       --save_name e9_baseline_llm --checkpoint_dir <CHECKPOINT_DIR>
name: e9_baseline
architecture: llm
wandb_project: GREP-PRISM
wandb_run_name: e9_baseline_llm
wandb_tag: e9_multistage_training
checkpoint_dir: outputs/e9_multistage_training
data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
val_data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
eval_data: data/revised/gen/nav100_n30_gemma_data/split/test_graphs
eval_num_graphs: 5
eval_epoch_interval: 1.0
base_model: google/gemma-4-12B-it
bit4: false
per_device_train_batch_size: 1
learning_rate: 0.0002
epochs: 1
r: 16
debug: false
dataset_proportion: 1.0
max_seq_length: 8192
text_edge_list: present
# Assistant-only loss — same objective as the PE stages for a fair comparison.
loss_target: responses
device: -1
