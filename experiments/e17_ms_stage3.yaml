# @package _global_
# e17 multistage — STAGE 3: unfreeze, train the graph channel + LoRA jointly, NO edges.
#
#   python -m prism.training.train_v3 --config-name=e17_ms_stage3 \
#       gnn.pe_gt_from=outputs/e17_mag_gt/suite2/mag_gt.pt
#
# RUN STANDALONE (no Stage 2). The MagE-GT arrives from the NOTEBOOK's resistance +
# link-prediction pretraining (2026-08-10 e17_magnet_composite_graphs.ipynb, §2 and §3)
# through gnn.pe_gt_from, and the LoRA starts fresh. Supply trainer.init_lora_from /
# trainer.init_pe_from ONLY when a Stage-2 run exists to carry: init_pe_from also restores
# that run's learned `beta`, and loaders raises if the source has no mask_beta rather than
# silently restarting the channel at mask_beta_init = 0.
#
# data.text_edge_list=none removes the edge bullets, so connectivity must now come from
# beta * C_tok alone. Assistant-only loss, for a fair comparison with Stage 1 / baselines.
#
# The architecture is INHERITED from e17_magnetic_composite_graphs, so the model trained
# here is the one the notebook pretrained, switch for switch.
defaults:
  - e17_magnetic_composite_graphs
  - _self_

name: e17_ms_s3

gnn:
  # The MagE-GT the notebook produced. suite2 is the current run; suite1 is finished.
  pe_gt_from: outputs/e17_mag_gt/suite2/mag_gt.pt
  semantic_gt_from: null

  # beta = 0.5 at step 0: the channel is ARMED from the first forward, rather than the
  # base config's cold start at 0. Two properties are given up deliberately —
  #   (a) step 0 no longer reproduces the base LLM's logits, so acceptance A2 does not
  #       hold at this setting (it still holds at beta_init = 0, which is what A2 tests);
  #   (b) there is no one-step stall: dL/dC = beta * dL/dbias is nonzero immediately, so
  #       the GT/MagNet train from step 1 instead of step 2.
  # In exchange the channel cannot sit at zero and report a clean run that trained
  # nothing. Watch mag/bias_absmax against the attention logit scale from the FIRST step.
  mask_beta_init: 1.0

  # Two-group LR (GraphSFTTrainer.create_optimizer): the graph channel — GT + MagNet +
  # beta, i.e. model.structural_parameters() — trains at 0.12x the LoRA's LR. At
  # trainer.learning_rate 2.5e-4 that puts the structural group at 3e-5: slower than the
  # adapter, but a rate the channel genuinely moves at, so beta is NOT expected to sit at
  # its init. Watch mag/beta over the run — starting armed at 0.5, it is free to grow or
  # decay, and a run that drives it toward zero is the channel reporting it is not useful.
  structural_lr_mult: 0.12

data:
  # Edge list REMOVED — connectivity must come from the graph channel now.
  text_edge_list: none
  spine_tools: none
  icl_examples: 0
  # NOT the e13f command's decode_consistent: train_v3._validate_config REJECTS it under
  # mask_composite, and it is the wrong rule here anyway — that map reduces an answer
  # mention to its single knowable position, while this arm crosslinks every sub-token and
  # grows the graph as the answer arrives. full_sequence is what the notebook builds under.
  injection_scope: full_sequence
  edge_weights: binary

trainer:
  # Stage-3 regime: both the adapter and the graph channel train.
  freeze_lora: false
  freeze_pe: false
  loss_target: responses
  epochs: 3

  # The e13f command's 0.00025. beta does NOT have to travel from zero here (it starts at
  # 0.5), and the structural group is at 0.12x this, so both the adapter and the channel
  # move. CHOSEN, not measured: watch mag/bias_absmax stay within an order of magnitude of
  # the attention logit scale, and mag/beta neither collapse nor run away.
  learning_rate: 0.00025

  bit4: true
  checkpoint_dir: outputs/e17_magnetic_composite_graphs
  save_name: e17_ms_stage3
  sft:
    save_total_limit: 1

eval:
  data: data/n_30/gen/nav100_n30_gemma_data/split/test_graphs
  # 3 graphs, for a cheap A/B against the other arms rather than a headline accuracy.
  # Generation is the expensive half here: the mask forces EAGER attention (the bias has
  # to reach the logits), so a 2500-token prompt costs several GB on top of the NF4 base
  # and a full -1 sweep is what pushes a 24 GB card over. Raise it for a final number,
  # and use the SAME value across arms or the comparison is not one.
  num_graphs: 3

wandb:
  run_name: e17_ms_stage3_joint
  tag: e17
