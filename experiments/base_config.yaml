# GREP-PRISM unified training config (Hydra) — single nested base.
#
# This file holds the MERGED, MOST-RECENT-WINS default (e9 > e8 > e7): gemma-4-31B,
# revised corpus, bf16 (bit4=false), multi-graph eval, assistant-only loss, rpearl_llm.
# Per-experiment files under experiments/ inherit this via `defaults: [base_config, _self_]`
# and override only their deltas. Architecture / sweep / base-model variants are documented
# inline as commented alternatives (uncomment or override on the CLI, e.g.
# `gnn.arch=gt_llm gnn.gt_num_layers=5 gnn.k_gt=1 gnn.pe_node_features=word_embeddings`).
#
# Consumed directly as a flat-ish nested OmegaConf object (no static dataclass); every
# module receives the whole `config` and reads its own section.

# Run-series label; used in the auto checkpoint subdir {name}_{arch}_{model}_r{r}[_4bit].
name: e9

model:
  # Base LLM. DEFAULT = Gemma-4 31B (multimodal; LoRA vision/audio-tower exclusion is
  # auto-applied). 31B is the default ON PURPOSE so a confirmatory run is never silently
  # downsized to 12B — override explicitly for the smaller/cheaper bases:
  #   google/gemma-4-12B-it              # text-only 12B (fast dev only; NOT the confirmatory base)
  path: google/gemma-4-31B-it
  # disable_graph_token_rope: position_id 0 on node-name tokens so RoPE is identity
  # there (set true for the norope_graph run).
  disable_graph_token_rope: false

gnn:
  # Master architecture switch — determines which gnn.* keys the code actually reads;
  # the rest compose harmlessly.
  #   llm | rpearl_llm | rpearl_gt_llm | gt_llm | graph_mask_llm | learnable_graph_mask | wire_llm
  arch: rpearl_llm

  # --- Numerics shared by the R-PEARL encoder AND the Graph Transformer + PE gate ---
  d_model: 1024
  dropout: 0.1
  use_layer_norm: true
  eps: 1e-6
  # PE-injection gate g = tanh(pe_gain). 0.0 = closed at init (Ψ ramps in; PE still
  # trains since tanh'(0)=1). use_pe_norm rescales projected Ψ to the embedding scale.
  pe_gain_init: 0.0
  use_pe_norm: true

  # --- R-PEARL probe positional encoder ---
  pe_hidden_channels: 256
  pe_num_layers: 2
  num_samples: 40
  k_pe: 2
  # (R-PEARL probe distribution / fixed-seed / gather-cap knobs live as module
  # defaults in models/r_pearl.py — no live architecture overrides them.)
  # "random" = PEARL random probes; "word_embeddings" = mean node-name word-embedding
  # (deterministic). gt_llm REQUIRES word_embeddings.
  pe_node_features: random
  # rpearl_gt_llm only. false (DEFAULT) = the GT sees the PE alone. true = the GT blocks
  # see Phi(X + P; T): node features X (mean node-name word-embedding, same source as
  # gt_llm) are projected and ADDED to the probe PE P = E_q[Phi(q; S, H)]. Unlike
  # pe_node_features=word_embeddings this KEEPS the random probes — the features are
  # fused in the GT, not swapped into R-PEARL. Leave pe_node_features=random with it.
  fuse_node_features: false
  # Probe backbone: false (DEFAULT, every run so far) = TAGConv GCN, undirected.
  # true = MagNet (models/magnet.py) — magnetic Laplacian, direction kept as a phase.
  # Only bites on an asymmetric edge_index; the SPINE scene graphs are undirected
  # (from_networkx emits both directions), so there Theta = 0 and it is a backbone
  # A/B, not a directionality one.
  directed: false
  # learn_r: MagNet's charge r is learned (one shared scalar, sigmoid-constrained to
  # [0, 0.25]) instead of pinned. Read by gt.build_psi_producer, i.e. by the Psi-consuming
  # archs; false is the value every checkpoint so far was written with, so leaving it
  # false keeps those reloading as themselves. REQUIRED true by wire_composite, where r
  # is the amount of directional phase the token cycle needs to carry position at all.
  learn_r: false
  # --- MagNet (directed) only: PEARL Assumption 4.2, ||H(S)|| <= beta ---
  # enforce_beta_bound: post-optimizer-step projection holding every MagChebConv at
  # sum_k ||H_k||_2 <= 1/F (F = pe_hidden_channels), the beta of Thm 4.3 / Cor 4.6.
  # ONE global scalar per layer; excludes r_logit, the modReLU biases and the unwind
  # Linear. No-op on the undirected TAGConv backbone (no MagChebConv to project).
  enforce_beta_bound: true
  # hidden_norm: normalization BETWEEN MagNet's hidden layers.
  #   "none" (DEFAULT) = none; the beta projection alone controls scale.
  #   "global_rms" = divide by one detached, non-affine scalar sqrt(mean|x|^2) over all
  #        nodes and channels. Modulus-based, so conjugation-equivariant.
  # The pre-fix per-node LayerNorm is REMOVED, not offered: it is not 1-Lipschitz and
  # its affine shift is not conjugation-equivariant. Deliberately omitted — do not add.
  hidden_norm: none
  # WHERE the probe expectation E_q is taken. Read ONLY by gt.build_psi_producer, i.e.
  # by the Ψ-consuming archs (learnable_graph_mask / wire_llm); train_v3 rejects a
  # non-default value on any other arch rather than ignoring it.
  #   "pe" (DEFAULT, what every existing run and checkpoint was trained with):
  #        inside R-PEARL — Ψ = Φ(E_q[Φ(q; S, H)], G, T); the GT blocks see the first
  #        moment only.
  #   "gt": after the blocks — Ψ = E_q[Φ(Φ(q; S, H), G, T)]. The M probe responses are
  #        pushed through the blocks as one block-diagonal M-copy graph (probes stay
  #        independent, weights shared) and averaged last. Costs M× the block
  #        activations and M× nnz(A_k); requires pe_node_features=random.
  pe_pool: pe

  # --- Graph Transformer (rpearl_gt_llm / gt_llm / learnable_graph_mask). Default = L2 baseline. ---
  # gt_llm depth/width sweeps (use with arch=gt_llm pe_node_features=word_embeddings):
  #   L3:        gt_num_layers=3 gt_heads=8  k_gt=1
  #   L4:        gt_num_layers=4 gt_heads=8  k_gt=1
  #   L5:        gt_num_layers=5 gt_heads=8  k_gt=1
  #   L5_d2048:  gt_num_layers=5 gt_heads=16 k_gt=1 d_model=2048
  #   L5_d3072:  gt_num_layers=5 gt_heads=24 k_gt=1 d_model=3072
  #   L5_d4096:  gt_num_layers=5 gt_heads=32 k_gt=1 d_model=4096
  gt_num_layers: 2
  gt_heads: 8
  k_gt: 2

  # Navigator PE (arch=learnable_graph_mask OR arch=wire_llm — both consume a bare Ψ
  # producer). Ψ is the notebook (e9_gnn_navigation.ipynb) pretrained PE GT ALONE, i.e.
  # gt.NavigatorPE's stage: Ψ = PE_GT(graph). The Semantic GT is the AGT head and belongs
  # to gt.NavigatorGT (the autoregressive navigator), NOT to Ψ.
  #   pe_gt_from      -> path_navigator_gt.pt, a plain state_dict poured into the
  #                      standalone GraphTransformer gt.build_psi_producer returns.
  #                      This is the ONLY knob a current run should set.
  #   semantic_gt_from-> LEGACY. Setting it (together with pe_gt_from) selects
  #                      gt.TwoStagePE, the pre-split producer Ψ = SemanticGT(PE_GT(graph)),
  #                      and exists ONLY so checkpoints trained that way (the e13
  #                      navigator arms) reload as the function they were trained as.
  #                      Leave null for new runs.
  pe_gt_from: null
  semantic_gt_from: null

  # --- graph_mask_llm structural attention mask (parameter-free) ---
  # Also read by learnable_graph_mask for the adjacency A.
  mask_k_hops: 1
  mask_symmetrize: true
  mask_use_edges: true
  # A/B ablation: true reproduces the pre-fix causal/sliding-mask leak (blocked positions
  # become attendable at the sliding layers ⇒ near-bidirectional attention). false = correct.
  mask_buggy_causal_fold: false

  # --- learnable_graph_mask (relative PE: learnable outer-product attention bias) ---
  # M = alpha*A + (1-alpha)*scaled(Psi Psi^T); A hard-blocks non-edges; Psi from a
  # STANDALONE GraphTransformer (reuses the gt_*/pe_* params above) + mask_k_hops/
  # symmetrize/use_edges for A. Requires pe_node_features=random (probe-based GT).
  mask_alpha: 0.7            # edge value = alpha + (1-alpha)*sim; non-edge = blocked (alpha in [0,1))
  mask_layer_scope: dense    # "all" = every layer | "dense" = all global layers | "dense_top_half" = deeper half of globals | "dense_first" = first global only
  mask_psi_scale: cosine     # "cosine" (row-normalized, sim in [-1,1]) | "inv_sqrt_d" (Gemma-style raw/sqrt(D))

  # --- learnable_graph_mask, mask_composite arm (gnn_llm.MagCompGraphLLM) ---
  # false (DEFAULT, every run so far) = the Psi Psi^T node-pair gate above.
  # true = the bias is beta * C_tok, the token block of the probe COVARIANCE
  #   C = E_q[Phi' Phi'^T] - Psi Psi^T over Phi' = T(Phi(q; L_bar^(r), H)) on the COMPOSITE
  #   graph (directed token cycle + scene + scene->token crosslinks + anchor). Placed at
  #   [start, end)^2 only: the system prompt and the ICL graphs get NO bias at all, and
  #   nothing is hard-blocked. REQUIRES directed=true, learn_r=true and pe_pool=gt (all
  #   three asserted in MagCompGraphLLM.__init__ and in _validate_config).
  # mask_alpha / mask_psi_scale / mask_k_hops / mask_symmetrize / mask_use_edges are
  # INERT under it — build_structural_mask is overridden wholesale.
  mask_composite: false
  mask_cycle_size: 8192      # cap on c, the token cycle length. COST scales as c^2.
  mask_beta_init: 0.0        # beta at step 0. 0.0 = the base LLM's logits, exactly.
  # Initial MagNet charge, written into the shared r_logit before any checkpoint load.
  # Eigenvalues of L_bar^(r) collide on the length-c cycle iff dist(2rc, Z) = 0; at
  # c = 8192 this r gives 2rc = 2064.384, a margin of 0.384. Changing mask_cycle_size
  # moves the degeneracies — watch prism.eval.callbacks.ChargeDegeneracyCallback.
  mask_magnet_r: 0.126
  mask_cycle_weight: 1.0
  mask_cycle_causal: false   # true transposes the cycle so a token reads its PREDECESSOR
  mask_crosslink_weight: 0.1
  mask_anchor_enabled: true  # false ablates the t_0 -> a -> v_0 bond (G may disconnect)
  mask_anchor_weight: 10.0

  # --- MagNet phase / shift and the R-PEARL probe statistic (Psi-producer archs) ---
  # Read by gt.build_psi_producer; each default IS the module default, i.e. what every
  # existing run and checkpoint was built with, so leaving them alone changes nothing.
  phase: binary              # Theta^(r) = 2*pi*r*sgn(A - A^T) | "weight" (unnormalized)
  shift: laplacian           # S = L_hat^(r) = -H_bar^(r) | "adjacency" (S = H_bar^(r))
  probe_distribution: gaussian   # "gaussian" N(0,I) | "rademacher" (+/-1); both E[q]=0, unit 2nd moment
  fixed_seed_mode: false     # true re-seeds the probes every forward, so Psi/C are reproducible
  fixed_seed_value: 0
  # Center E[Phi Phi^T] into the covariance C = E[Phi Phi^T] - Psi Psi^T. true removes the
  # rank-1 Psi Psi^T bias that otherwise dominates, and makes C manifestly PSD.
  center_second_moment: true
  # Reuse the graph channel across consecutive forwards over the SAME graph object (Psi
  # for the GT; C_tok for mask_composite). Fills only under no_grad — a cached tensor
  # carries its autograd graph. false = recompute every forward.
  cache_pe: false
  # Probe chunking: chunk = min(num_samples, max_probe_rows/N, max_gather_rows/E) probes
  # are pushed through the backbone at a time, and ONE chunk is the peak activation, so
  # these are the memory dial for the probe path. Defaults are the module values.
  max_probe_rows: 65536
  max_gather_rows: 2000000

  # --- wire_llm (WIRE: Psi enters as a ROTATION of q/k, not an added signal) ---
  # q_i -> R(theta_i) q_i, k_j -> R(theta_j) k_j with theta_n = omega_n . Psi_i, composed
  # on top of Gemma's own RoPE. Reuses the gt_*/pe_* GT above as the Psi producer.
  # Requires pe_node_features=random. NOTE: this downweights attention by a LEARNED
  # Psi-distance; the effective-resistance reading of WIRE Theorem 3 additionally needs
  # Psi = [u_k/sqrt(lambda_k)], which the mean-pooled GT readout does NOT provide.
  wire_layer_scope: dense      # "all" | "dense" | "dense_top_half" | "dense_first" (as mask_layer_scope)
  # THE MODE SWITCH. true (DEFAULT) = strictly the paper's algorithm: omega is ONE
  # LEARNABLE [P, m] table per layer and nothing else. Section 3.3: "In practice, one does
  # not sample and average over an ensemble of random WIRE transformations, but instead
  # takes one learnable instantiation." No eps, no sigma, no Monte-Carlo framing — the
  # expectation those exist to serve is never taken. The sin term of Eq. 8 is retained
  # (dropping it is an expectation-motivated approximation and appears NOWHERE in the
  # paper or its reference implementation; it also destroys orthogonality and Eq. 3).
  # false = the expectation arm: omega = sigma_l * eps_l with eps ~ N(0, I) frozen and a
  # learnable per-layer scalar sigma, plus the Theorem-3 telemetry. Unchanged from before
  # this switch existed, and still the arm to use for a literal-Theorem-3 A/B.
  # Frequencies are shared across heads in BOTH modes: 3.1 lists head sharing explicitly
  # ("one can share WIRE weights between layers or heads"), and it is the only
  # granularity that keeps Eq. 3 exact under Gemma's GQA, where one key head serves
  # several query heads and so q and k must rotate by identical frequencies.
  # The ANGLE CLAMP (wire_max_angle) stays ACTIVE in vanilla mode — see there for why.
  wire_vanilla: true
  # omega init for wire_vanilla=true ONLY. These are the reference implementation's own
  # cfg.gt.graphrope.init_omega values and its default:
  #   zero        (DEFAULT) omega = 0 => theta = 0 => the rotation is EXACTLY the identity
  #               at step 0 and omega learns away from it. Trainable at that point only
  #               because the sin term is kept: d sin(theta)/d omega = r != 0 there.
  #   uniform     torch's default nn.Linear init, U(-1/sqrt(m), 1/sqrt(m)).
  #   exponential RoPE-style rand(P, m) / 10000^(2i/P). Reproduced verbatim including two
  #               quirks of the source: the exponent denominator is P (twice standard
  #               RoPE's decay rate) and the decay is constant along the spectral axis.
  # wire_sigma_init is INERT when wire_vanilla=true; wire_omega_seed seeds the uniform /
  # exponential draws and is inert for "zero".
  wire_vanilla_omega_init: zero
  # --- the following apply when wire_vanilla=false (the expectation arm) ---
  # Frequencies are reparameterised as omega = sigma_l * eps_l: eps is drawn ONCE from
  # N(0, I) (seeded below, frozen, checkpointed) and sigma_l is a LEARNABLE per-layer
  # scalar. So omega stays a genuine Gaussian sample (Theorem 3's hypothesis) while the
  # trained quantity is exactly the omega in q^T k (1 - omega^2 R(i,j)/2). ONE table per
  # LAYER, shared by all heads: the modulation is computed once per layer (H x less
  # work) and each head keeps its own q^T k. Monte-Carlo samples come from the P rotary
  # planes in the shared table, so the count DIFFERS BY LAYER TYPE (31B: 256 planes on
  # global head_dim=512, 128 on sliding head_dim=256, or 64 global when
  # wire_rotate_nope_planes=false) — a real variance asymmetry across layers.
  # sigma_init: only sigma*||Psi_i - Psi_j|| matters, and it must START small. SCALE WITH
  # 1/sqrt(d_model): ||Psi_i|| is MEASURED at ~1.1*sqrt(d_model) (8.9 @ d_model=64, 35.4
  # @ 1024, and FLAT in node count), so 0.01 puts the angle near 0.4 rad at d_model=1024.
  # At d_model=2048/4096 divide by sqrt(2)/2 respectively. NOTE this scaling is EMPIRICAL,
  # not structural: GraphTransformer builds its FINAL SparseTransformerBlock with
  # normalize=False (gt.py:307 / :457), so there is NO output LayerNorm pinning ||Psi_i||
  # and training may move it. wire_max_angle below is the actual guarantee.
  wire_sigma_init: 0.01
  wire_freeze_sigma: false     # true pins sigma = the literal-Theorem-3 A/B arm
  wire_omega_seed: 0           # seed for the frozen eps draw (eps itself is saved in gnn_weights.pt)
  # Gemma global layers use rope_type=proportional with partial_rotary_factor=0.25: only
  # int(0.25*head_dim/2) planes carry text RoPE, the rest are NoPE. true also rotates
  # those position-free channels.
  wire_rotate_nope_planes: false
  # The ONLY angle threshold. sigma is trainable, so this is enforced by an EXACT,
  # UNCONDITIONAL clamp (layer_scale_factor): the effective sigma is scaled so
  # sigma_eff * max||Psi_i - Psi_j|| <= wire_max_angle on every forward, by construction.
  # It can never fail a run. Because a clamped sigma keeps growing with no effect, watch
  # wire/sigma_raw_max vs wire/sigma_eff_max and wire/clamp_engaged in the logs —
  # saturation is otherwise invisible. (A previous wire_hard_max_angle that RAISED was
  # removed: no training run may be killed by the angle guard.)
  wire_max_angle: 1.0
  # Decode policy at cached steps. "rotate" = the real path: the KV cache stores UNROTATED
  # keys, so each step re-applies R(theta_j) to the PROMPT key slots (r is a function of
  # position only, so this reconstructs exactly the keys prefill scored against) and leaves
  # generated positions at r=0 — prompt-only decode, matching the additive/mask families.
  # "skip" = WIRE OFF for every generated token, a labeled diagnostic, never a result.
  # "error" is still accepted for checkpoints/configs written before decode existed; it is
  # normalised to "rotate" with a DeprecationWarning. NOTE wire_layer_scope="all" cannot
  # decode (sliding-window caches are cropped) and raises before generating.
  wire_decode: rotate          # "rotate" | "skip"  (legacy: "error" -> "rotate")

  # --- wire_composite (e17): WIRE over the COMPOSITE graph, REPLACING RoPE ---
  # false (DEFAULT) = the scene-graph WIRE above: Psi has one row per scene NODE, placed
  # at that node's mention tokens, and R(theta) composes on top of Gemma's RoPE.
  # true = Psi is computed on the COMPOSITE graph G = V_Tx (the directed token cycle) +
  # V_Sc (the scene graph) + E_Cross (mention crosslinks) + one anchor node, so EVERY
  # token in scope gets its own row, and RoPE is switched OFF (position_id 0) on exactly
  # the positions WIRE covers. The token cycle carries sequence position ONLY as the
  # phase of the magnetic Laplacian, so this arm REQUIRES directed=true, learn_r=true and
  # a non-zero rotation at init (pe_gain_init > 0, wire_vanilla_omega_init != "zero") —
  # all four are checked in CompositeWireGraphLLM.__init__, not assumed.
  wire_composite: false
  # Initial MagNet charge, written into the shared r_logit. 0.1250305176 = 0.25*sigmoid(2^-11)
  # is a hair off 1/8 ON PURPOSE: L_bar^(r)'s eigenvalues collide on the length-c cycle iff
  # dist(2rc, Z) = 0, and at c = 1024 this gives 2rc = 256.0625, a margin of 1/16 that
  # r = 1/8 would sit exactly on. Recalibrate it if wire_context_window changes.
  wire_magnet_r: 0.1250305176
  # c, the token cycle length: the prompt FROM the last scene-graph block on, capped here
  # (counted from the block, so a long prompt is cut in the tail and never on the block).
  # Tokens outside [scope_start, scope_start + c) keep plain RoPE and get no Psi.
  wire_context_window: 1024
  # Composite edge weights and directions (build_composite_graph). MagNet symmetrizes A
  # and keeps direction only as the phase, so transposing an edge conjugates Psi.
  wire_cycle_weight: 1.0
  wire_cycle_causal: false          # true = the transposed cycle t -> t-1 (notebook 2 form)
  wire_crosslink_weight: 0.1
  wire_crosslink_bidirectional: true
  wire_anchor_weight: 10.0

  # Two-group LR: structural (GT/PE) params train at structural_lr_mult x base LR
  # (GraphSFTTrainer.create_optimizer). 1.0 = no boost.
  structural_lr_mult: 1.0

data:
  # Revised nav100 corpus (e8/e9). Legacy e7 alternative:
  #   train_files: data/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
  #   val_files:   data/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
  #   text_edge_list: none
  train_files: data/n_30/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
  val_files: data/n_30/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
  val_frac: 0.1
  dataset_proportion: 1.0
  max_seq_length: 8192
  # "present" writes the edge list into the prompt; "none" removes it (connectivity must
  # come from the graph PE — the Stage-3 / no-edges axis).
  text_edge_list: present
  # SPINE tool calling in the TRAINING text. "present": the system prompt documents the
  # SPINE API (goto/map_region/explore_region/extend_map/inspect/answer), requires every
  # hop to be ratified with map_region before answer() — no hallucinated edges — and the
  # SFT targets keep their action-list plans. "none": no tool calls; the model reasons
  # over adjacencies by thought and the targets are bare `a -> b` routes.
  #
  # DEPLOYMENT IS DELIBERATELY ASYMMETRIC: we TRAIN tool-free ("none") and DEPLOY with the
  # SPINE API live (eval reads PRISM_DISABLE_SPINE_TOOLS, unset = tools on, which also
  # selects GraphSim over _NoToolsGraphSim). The seam absorbs the difference: a model
  # trained on bare routes emits a bare route, and compact_output_to_spine_json wraps it
  # as [answer(route)] for the planner. The residual cost is that the deployed contract
  # asks for an action list the model was never trained to emit — flip this to "present"
  # (and regenerate rollouts that actually call tools) if that gap ever shows up in evals.
  spine_tools: none
  # Few-shot examples prepended to each training prompt, taken from
  # evaluate.SPINE_ICL_EXAMPLES (EXAMPLE_1, EXAMPLE_2) — the same ones eval sends. 0 =
  # zero-shot (what we train and deploy today), 2 = few-shot; keep it equal to
  # eval.use_icl's effect, since ICL also MOVES the scene graph out of the system message
  # and into the query turn. Each example costs prompt length (~1.7k Llama-3 tokens for
  # the two, measured), and its own scene-graph block precedes the query's (which stays
  # last, so PE injection still scopes to the query graph). NOTE: those canned examples
  # call goto/map_region, so only pair icl_examples>0 with spine_tools=present.
  icl_examples: 0
  # GNN edge weighting over the scene-graph adjacency ("gaussian" | "binary").
  # "gaussian" (historical): edge_weight = exp(-d^2/2sigma^2), sigma = per-graph median
  # edge length (E1 Gaussian affinity), consumed by the R-PEARL/GT GCN. On SBM-with-
  # geometry graphs this nearly severs the long inter-community edges. "binary": no
  # edge_weight attached — GNNs see the plain SBM adjacency. Applies to train collator
  # AND all eval graph parsing; recorded in train_config.json.
  edge_weights: binary
  # Which token positions carry the graph channel (PE / structural mask) during TRAINING:
  # "full_sequence" (historical) also injects node mentions inside the assistant answer —
  # the predicted positions carry the ground-truth node's channel, which generation never
  # has (decode steps receive no injection). "prompt_only" clamps injection maps at
  # answer_start so training matches generation exactly. "exclude_supervised" (e12)
  # subtracts the loss-target positions (trainer.loss_target's index column, e.g.
  # edge_list_idx) — use for loss_target='edge_list', where the supervised block is in
  # the PROMPT and prompt_only would not remove the leak.
  injection_scope: full_sequence
  # debug=true downsamples train+val to dataset_proportion before splitting.
  debug: false

lora:
  r: 16          # LoRA rank
  alpha: 16      # LoRA scaling (alpha/r multiplies the update)
  dropout: 0.2
  # Adapted projections (attention + MLP); multimodal towers are auto-excluded.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

trainer:
  # Run dir = {checkpoint_dir}/{save_name}_{wandb_id}; save_name=null derives
  # {name}_{arch}_{model_slug}_r{r}[_4bit] automatically.
  checkpoint_dir: outputs/e9_multistage_training
  save_name: null
  # -1 lets device_map="auto" place the model; 0 pins the whole model to GPU 0.
  device: -1
  # bf16 (bit4=false) is required for the PE-only stage; set bit4=true for 4-bit QLoRA.
  bit4: false
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2   # effective batch = per_device x this
  gradient_checkpointing: true     # trade compute for VRAM (required at 31B)
  dataloader_num_workers: 4
  dataset_num_proc: 8              # workers for dataset .map preprocessing
  learning_rate: 0.0002
  warmup_steps: 5
  weight_decay: 0.05
  epochs: 1
  max_steps: -1     # >0 caps optimizer steps (dev) and switches save/eval to step-based
  no_train: false   # true = skip optimization, zero-shot eval the base model
  report_to: wandb  # "none" disables tracking (smoke runs)
  overwrite_ok: false  # allow reusing a non-empty run dir
  # Per-component grad-norm logging (no-op for non-PE/GT archs).
  gradient_debug: true
  # Free-form passthrough merged LAST into SFTConfig — set ANY SFTConfig /
  # TrainingArguments field without a dedicated code path, e.g.
  #   +trainer.sft.lr_scheduler_type=cosine +trainer.sft.logging_steps=5
  sft: {}

  # --- Freeze regime + multistage weight carry-over (NOT HF resume) ---
  freeze_llm: false
  freeze_lora: false
  freeze_pe: false
  init_lora_from: null
  init_pe_from: null
  # "all" | "responses" (assistant-only) | "edge_list". edge_list REQUIRES
  # data.text_edge_list=present.
  loss_target: responses

eval:
  # Multi-graph eval: a DIRECTORY of {graph, tasks} JSONs, capped to num_graphs/interval.
  # Single-graph alternative: a single JSON file, e.g.
  #   data: data/n_30/gen/nav100_n30_gemma_data/split/test_graphs/data_gen_023.json
  data: data/n_30/gen/nav100_n30_gemma_data/split/test_graphs
  num_graphs: 5       # cap on evaluated graphs; -1 = the whole directory
  epoch_interval: 1.0 # run the generation eval every this many epochs
  # false = zero-shot eval prompts (the deployed setting; matches data.icl_examples=0).
  # true keeps SPINE's two ICL examples, compacted, ahead of the query — and moves the
  # scene graph out of the system message into the query turn, so train with
  # data.icl_examples=2 if you turn this on.
  use_icl: false
  # Held-out graph set evaluated once post-training (reloaded from the saved checkpoint).
  post_train_graphs: null

wandb:
  project: GREP-PRISM
  run_name: e9_hydra          # display name; also SFTConfig.run_name
  tag: e9_multistage_training # groups the runs of one experiment series

# Hydra runtime: do NOT chdir (relative data:/checkpoint paths resolve against launch cwd);
# keep Hydra's own run logs under outputs/hydra/.
hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/hydra/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
