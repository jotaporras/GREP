name: e7
architecture: augmented_graph_gt
wandb_project: GREP-PRISM
wandb_run_name: e7_augmented_graph_gt_no_edges
wandb_tag: e7_architecture_experiments
checkpoint_dir: outputs/e7_architecture_improvements
data: /home/shared/GREP-PRISM/data/gen/e5_graph_oriented_data/split/formatted_all_new__train.json
val_data: /home/shared/GREP-PRISM/data/gen/e5_graph_oriented_data/split/formatted_all_new__val.json
eval_data: /home/shared/GREP-PRISM/data/gen/e5_graph_oriented_data/split/test_graphs/data_gen_004.json
base_model: meta-llama/Llama-3.1-8B-Instruct
bit4: true
per_device_train_batch_size: 1
learning_rate: 0.0002
epochs: 2
r: 16
debug: true
dataset_proportion: 1.0
max_seq_length: 8192
text_edge_list: none
# Graph Transformer + R-PEARL params
d_model: 4096
gt_num_layers: 3
gt_heads: 8
pe_hidden_channels: 256
pe_num_layers: 5
num_samples: 40
dropout: 0.1
k_pe: 5
k_gt: 2
eps: 1e-6
use_layer_norm: true
freeze_llm: false
device: -1
# Augmented graph params
cycle_directed: true
cycle_weight: 1.0
affinity_kernel: gaussian
sigma_mode: median
keep_raw_distance_feature: true
crosslink_weight: 1.0
crosslink_mention_to_node: true
crosslink_mention_clique: true
# R-PEARL sampling
probe_distribution: gaussian
m_test: 128
fixed_seed_mode: false  # Switch
fixed_seed_value: 0
# R-PEARL readout fed to the GT: 'mean' = first moment E_q[Phi(q)] (collapses to a
# node-constant on the vertex-transitive sequence cycle, so position is lost);
# 'second_moment' = C @ X for C = E_q[Phi(q) Phi(q)^T], which carries the relative
# position (the q_n^T k_m bilinear) the first moment averages away.
pe_readout: second_moment  # Switch
# Gated injection
injection_mode: none       # inputs_embeds = Y: the Graph Transformer output is fed straight to the LLM
                           # with NO gate and NO mixing of the token embeddings X. The LLM must consume
                           # the structural representation directly; lora_warmup_steps keeps the LLM
                           # frozen long enough for the GT to learn an LLM-consumable representation
                           # first (X still seeds the GT cycle nodes, so token content is not lost).
gate_init: 0.3             # unused in 'none' mode (no learnable gate); kept for reload compatibility
gate_per_dim: false        # unused in 'none' mode
structural_lr_mult: 20.0
lora_warmup_steps: 200     # freeze the LLM/LoRA for the first 200 optimizer steps so the GT shapes its
                           # output before the adapters adapt to it ('a good number of samples')
# LLM
disable_rope: true
n_icl_examples: 2       # Switch
# Debug / viz
log_fiedler: true
log_scene_mass: true
enable_visualizer: true
