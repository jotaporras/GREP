name: e7
architecture: composite_graph_gt
wandb_project: GREP-PRISM
wandb_run_name: e7_composite_graph_gt_c_bias_no_edges_revised
wandb_tag: e7_architecture_experiments
checkpoint_dir: outputs/e7_architecture_improvements
data: data/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
val_data: data/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
eval_data: data/gen/nav100_n30_gemma_data/split/test_graphs/data_gen_023.json
base_model: meta-llama/Llama-3.1-8B-Instruct
bit4: true
per_device_train_batch_size: 1
learning_rate: 0.0002
epochs: 3
r: 16
debug: true
dataset_proportion: 1.0
max_seq_length: 8192
text_edge_list: none
# Graph Transformer + R-PEARL params
d_model: 4096
gt_num_layers: 3
gt_heads: 8
pe_hidden_channels: 256
pe_num_layers: 2
num_samples: 96
dropout: 0.05
k_pe: 2
k_gt: 2
eps: 1e-6
use_layer_norm: true
freeze_llm: false
device: -1
# Composite graph params
cycle_directed: true
cycle_weight: 1.0
affinity_kernel: gaussian
sigma_mode: median
keep_raw_distance_feature: true
crosslink_weight: 1.0
crosslink_mention_to_node: true
crosslink_mention_clique: true
# R-PEARL sampling
probe_distribution: gaussian
m_test: 128
fixed_seed_mode: false
fixed_seed_value: 0
pe_readout: second_moment
pe_center_moment: true
# Gated injection — interpolate (NOT none): Design D needs real X content for the
# content match ⟨q,k⟩; with `none` the inputs are the untrained GT output (low variance
# → flat q/k → uniform attention). interpolate keeps (1-gate)·X so selection works,
# while the additive C-bias supplies position. (Attention-sharpness probe: none→0.92
# entropy/soft, interpolate→0.58/structured.)
injection_mode: interpolate
gate_init: 0.3
gate_per_dim: false
structural_lr_mult: 5.0
lora_warmup_steps: 20
# LLM
disable_rope: true
n_icl_examples: 2
c_per_layer: false
pe_qk_injection: false
# Design D: RoPE-free C-in-attention (additive C/S̃ logit bias + residual C-values)
c_bias: true
use_scene_bias: true
# Debug / viz
log_fiedler: true
log_scene_mass: true
enable_visualizer: false
