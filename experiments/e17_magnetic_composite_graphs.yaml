# @package _global_
# e17 — the LEARNABLE ATTENTION MASK over the MAGNETIC COMPOSITE graph.
#
#   python -m prism.training.train_v3 --config-name=e17_magnetic_composite_graphs
#
# The bias added to every in-scope attention logit is
#
#   Phi'(q) = T(Phi(q; L_bar^(r), H))     the GT blocks, applied PER PROBE, inside E_q
#   Psi     = E_q[Phi']
#   C       = E_q[Phi' Phi'^T] - Psi Psi^T
#   A       = sm[ (Q x_n)^T (K x_m) / sqrt(d_h) + beta * C_tok[n, m] + M_causal ]
#
# with C_tok = C[:c, :c] the TOKEN block of the composite graph
# (directed token cycle + undirected scene + DIRECTED scene->token crosslinks + anchor;
# gnn_llm.build_composite_graph). beta is ONE learnable scalar starting at 0, so step 0
# is the base LLM's logits exactly. RoPE is untouched — this arm composes with it (that
# is what separates it from e17_composite_wire, which REPLACES RoPE).
#
# Everything before the last `scene graph:` block — system prompt, ICL graphs — gets NO
# bias, and nothing anywhere is hard-blocked: the bias is additive and finite.
#
# The preconditions the arm cannot run without are asserted in BOTH
# _validate_config (compose time) and MagCompGraphLLM.__init__ (construction):
#   directed=true      the cycle's position lives in the magnetic phase alone
#   learn_r=true       r is that phase budget
#   pe_pool=gt         T inside E_q; under "pe" C would be the PRE-block covariance
defaults:
  - base_config
  - _self_

name: e17

gnn:
  arch: learnable_graph_mask
  mask_composite: true

  # --- The composite graph ---
  # c = min(len(prompt), scope_start + mask_cycle_size) - scope_start, counted FROM the
  # block so the graph block itself is never the part cut. MEASURED on this corpus: the
  # Stage-3 training sequences run 4767-10593 tokens (median 5523) and scope_start ~ 540,
  # so c reaches ~7650 and this cap DOES engage on the longest few. At max_seq_length 2048
  # every one of 400 examples was truncated to about a third; 8192 truncates 3.
  # COST at the cap: the contraction forming C_tok is 2*M*c^2*D FLOP (4.4e13 at M=320,
  # D=1024) and C_tok is c^2 fp32 = 268 MB. It scales as c^2, not c — this is the single
  # most expensive number in the file.
  mask_cycle_size: 8192
  mask_cycle_weight: 1.0
  mask_cycle_causal: false
  mask_crosslink_weight: 0.1
  # The anchor bond t_0 -> a -> v_0 (exactly two edges) is what makes G one component,
  # and with it every magnetic effective resistance finite. Set false to ablate it.
  mask_anchor_enabled: true
  mask_anchor_weight: 10.0
  # 0 FREEZES the composite at the prompt, which is the only setting under which the
  # NOTEBOOK, TRAINING and DECODE all build the same graph. R > 0 cannot get there: R sets
  # when the rebuild happens, not what exists, and training holds an answer decode has not
  # written yet -- build_structural_mask rounds to the CEILING boundary (p_ref >= p) while
  # CompositeDecodeInjector holds the last C_tok at the FLOOR one, so they meet only at
  # R = 1, and the notebook (one graph over the whole conversation) agrees with neither.
  # Frozen, every segment reads ids[:answer_start], decode never rebuilds, and answer rows
  # carry no bias -- what decode already does past its window.
  # WHAT IT COSTS: the growing mention set. Generated tokens never join the directed cycle
  # and their labels never crosslink, so the bias encodes prompt structure only.
  # WHAT IT BUYS: one rebuild per sequence. Measured at M=32 on one 3090, one step took
  # 13.3s at R=512, 51.4s at R=8, and 324.1s at R=1; frozen is the 13s regime with none of
  # the leak. M, not R, is what made steps unfinishable at M=320.
  mask_decode_refresh: 0
  # Crosslink DIRECTION is not a knob: scene node -> token, arrowheads on the cycle.
  # Reversing or doubling it symmetrizes the pair and cancels Theta^(r) on exactly the
  # edges that bind text to scene. Fixed in MagCompGraphLLM, asserted in the tests.

  # --- The bias scale ---
  # beta = 0 at step 0 => identical logits to the base LLM. Note the one-step stall this
  # implies: dL/dC = beta * dL/dbias = 0 there, so beta moves first and the GT/MagNet
  # train from step 2. Stage 3 overrides this; see e17_ms_stage3.yaml.
  mask_beta_init: 0.0
  mask_layer_scope: dense

  # --- The magnetic probe backbone ---
  # r is written into the shared r_logit at construction and trained from there.
  # dist(2rc, Z) = dist(2064.384, Z) = 0.384 at c = 8192 — off the eigenvalue collision
  # that would make the cycle's rows indistinguishable.
  directed: true
  learn_r: true
  mask_magnet_r: 0.126
  phase: binary
  shift: laplacian
  hidden_norm: none

  # --- The probe statistic ---
  # pe_pool=gt is load-bearing: it is what applies T per probe INSIDE E_q, so both
  # moments are taken over the block outputs. center_second_moment=true makes C the
  # centered covariance (manifestly PSD, no fp32 cancellation).
  # fixed_seed_mode=false matches the notebook, which redraws every forward: the two
  # moments then share a draw in EXPECTATION rather than exactly, and C_tok carries
  # probe noise from step to step. That noise is the estimator the LLM is trained
  # against, so pinning the draw here would train beta on a C the notebook never fitted.
  pe_pool: gt
  probe_distribution: gaussian
  fixed_seed_mode: false
  fixed_seed_value: 0
  center_second_moment: true
  # false because the graph GROWS during decode: each generated token joins the directed
  # cycle and brings its own crosslinks as the mention set extends, so C_tok is a function
  # of a topology that changes every step. The memo would miss anyway (its key is
  # hash(input_ids) + scope + scene shape), but false states the intent rather than
  # relying on the key to save us.
  cache_pe: false

  # --- Sizing (the notebook's create_gnn, e17 cell 41; also e13f's) ---
  # base_config's smaller pe/gt block is a dev default and would train a different model.
  d_model: 1024              # the GT's `dim`
  pe_hidden_channels: 256
  pe_num_layers: 5
  k_pe: 3                    # MagChebConv filter size K
  gt_num_layers: 3           # the GT's `num_layers`
  gt_heads: 8
  k_gt: 2

  # --- The probe count M, and the memory it costs ---
  # M is NOT transferable from e17_composite_wire (which ran M=320). There pe_pool='pe'
  # means the GT runs ONCE on [N, D]; here pe_pool='gt' pushes all M probes through the
  # blocks, so the GT activations and nnz(A_k) both scale with M. Measured shapes on this
  # corpus: c up to ~7650 (max_seq_length 8192 minus scope_start ~ 540), N = c + n + 1,
  # E ~ c + 2|E_Sc| + sum_j |M_j| + 2 composite edges (doubled after MagNet symmetrizes).
  #   one [M, N, D] fp32 tensor         = M * 7.5 MB   ->  M=320: 2.4 GB, M=32: 240 MB
  #   GT retains ~(gt_num_layers+1) of them          ->  M=320: 9.6 GB, M=32: 960 MB
  #   MagNet gather [2*chunk*E, F] cplx = chunk * 8.0 MB  (x2 propagates x 5 convs)
  # M=320 is the notebook's value and this arm now matches it, so the pretrained MagGT is
  # fitted and consumed under the same probe count rather than a lower-variance C than the
  # LLM ever sees. It costs ~9.6 GB of GT activations: that fits a 48 GB card beside the
  # 31B NF4 base, and does NOT fit a 24 GB one (roughly 4-5 GB free there) — no amount of
  # chunking changes that, the GT stack is M-proportional. Drop to 32 for a 24 GB card.
  num_samples: 320
  # chunk = min(num_samples, max_probe_rows/N, max_gather_rows/E). 16384/1830 = 8 probes
  # per chunk, and ONE chunk is the peak (the loop is gradient-checkpointed), which caps
  # the MagNet gather at ~64 MB per propagate instead of ~280 MB at the 65536 default.
  max_probe_rows: 16384

  # --- Pretrained MagGT channel ---
  # A GT pretrained by the notebook's resistance-regression stage
  # (2026-08-10 e17_magnet_composite_graphs.ipynb §3, which fits C's induced distances to
  # alpha * R_eff of this same composite graph) is poured in here, straight into
  # model.pe_model, by loaders.load_navigator_pe_into. That stage pins the charge
  # (learn_r=false), so its state dict has no r_logit keys; the loader tolerates exactly
  # that gap and cold-starts r at mask_magnet_r above. Any other key mismatch raises.
  # trainer.init_pe_from is the other channel (a prior RUN's gnn_weights.pt).
  pe_gt_from: null
  semantic_gt_from: null

data:
  # full_sequence scopes the crosslinks to everything from the last `scene graph: •` block
  # on — build_injection_map already takes scope_start=tau — and clamps nothing after it.
  # This is what the notebook assembles composite graphs under, so the MagGT is pretrained
  # and consumed on the SAME E_Cross. The cost is a train/eval asymmetry the arm has to
  # own: at train time the answer is in the sequence and its mentions become crosslinks,
  # while at eval the prompt has no answer yet, so the prefill C_tok is built from fewer
  # crosslinks than training saw. decode_consistent is REJECTED for this arm.
  injection_scope: full_sequence
  # binary is what the notebook assembles composite graphs under; base_config's gaussian
  # affinity is a different scene layer.
  edge_weights: binary
  max_seq_length: 8192

trainer:
  bit4: true
  checkpoint_dir: outputs/e17_magnetic_composite_graphs
  save_name: e17_magnetic_composite_graphs

wandb:
  run_name: e17_magnetic_composite_graphs
  tag: e17
