# @package _global_
# Single-stage training (no carried-forward weights) — the merged default.
# loss_target=responses (assistant-only) matches the e9 baselines; it is the
# most-recent value where e7/e8 left it at the dataclass default.
freeze_llm: false
freeze_lora: false
freeze_pe: false
init_lora_from: null
init_pe_from: null
loss_target: responses
structural_lr_mult: 1.0
lora_warmup_steps: 0
lam_c_warmup_steps: 0
