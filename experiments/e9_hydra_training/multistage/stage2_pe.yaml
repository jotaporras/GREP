# @package _global_
# e9 Stage 2 — freeze the SFT'd LLM + carried adapter, train ONLY the PE as an
# edge-list reconstructor (loss_target=edge_list; edges MUST be in text).
# init_lora_from points at the Stage-1 checkpoint and is supplied by the driver
# (scripts/e9_multistage_training.sh) — override `init_lora_from=<dir>` at launch.
# Use with: architecture=rpearl_llm training=stage2_pe
freeze_llm: false
freeze_lora: true
freeze_pe: false
init_lora_from: null   # set by the driver to the resolved Stage-1 checkpoint dir
init_pe_from: null
loss_target: edge_list
structural_lr_mult: 1.0
lora_warmup_steps: 0
lam_c_warmup_steps: 0
