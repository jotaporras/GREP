# @package _global_
# e9 Stage 3 — unfreeze, train PE + LoRA jointly with edges REMOVED (set
# text_edge_list=none via data/CLI). Starts from the self-contained Stage-2 checkpoint:
# init_lora_from reattaches the adapter as trainable, init_pe_from loads the trained PE.
# Both are supplied by the driver — override at launch.
# Use with: architecture=rpearl_llm training=stage3_joint text_edge_list=none
freeze_llm: false
freeze_lora: false
freeze_pe: false
init_lora_from: null   # set by the driver to the resolved Stage-2 checkpoint dir
init_pe_from: null     # set by the driver to the resolved Stage-2 checkpoint dir
loss_target: responses
structural_lr_mult: 1.0
lora_warmup_steps: 0
lam_c_warmup_steps: 0
