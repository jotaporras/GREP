# @package _global_
# Optimizer / trainer / schedule — merged default (e9: bf16, 1 epoch, LR 2e-4).
# bit4=false because the e9 PE-only stage cannot train in 4-bit; override `bit4=true`
# for the e7/e8 4-bit runs.
bit4: false
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
gradient_checkpointing: true
dataloader_num_workers: 4
learning_rate: 0.0002
warmup_steps: 5
weight_decay: 0.05
epochs: 1
max_steps: -1
no_train: false
