# @package _global_
# e9 Stage 3 optimizer schedule: joint PE + LoRA, 3 epochs at LR 3e-3. Pair with
# `multistage=stage3_joint`.
bit4: false
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
gradient_checkpointing: true
dataloader_num_workers: 4
learning_rate: 0.003
warmup_steps: 5
weight_decay: 0.05
epochs: 3
max_steps: -1
no_train: false
