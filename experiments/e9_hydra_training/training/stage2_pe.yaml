# @package _global_
# e9 Stage 2 optimizer schedule: PE-only, "as long as it takes" (generous epochs,
# higher LR). Pair with `multistage=stage2_pe`.
bit4: false
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
gradient_checkpointing: true
dataloader_num_workers: 4
learning_rate: 0.005
warmup_steps: 5
weight_decay: 0.05
epochs: 8
max_steps: -1
no_train: false
