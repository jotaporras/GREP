# @package _global_
# INERT composite-graph defaults (TrainConfig dataclass values). Composed only when this
# option is selected; these keys are read ONLY by architecture=composite_graph_gt, so they
# never affect the rpearl/gt/mask baselines. Deliberately sets NO structural keys (d_model,
# num_samples, pe_readout, ...) so it cannot clobber the merged baseline — the real e7 designs
# (centered / c_bias / c_per_layer) carry their own structural overrides.
# Universal fallbacks (pe_inject_v / use_scene_bias / c_kernel) live in the always-composed
# composite_base group so every design has them, not just this one.
# Composite graph construction
cycle_directed: true
cycle_weight: 1.0
affinity_kernel: gaussian
sigma_mode: median
keep_raw_distance_feature: true
crosslink_weight: 1.0
crosslink_mention_to_node: true
crosslink_mention_clique: true
# Gated injection / C-in-attention
injection_mode: interpolate
gate_init: 0.0
gate_per_dim: false
pe_qk_injection: false
c_per_layer: false
c_bias: false
