# @package _global_
# R-PEARL probe positional encoder. Merged default = e8/e9 rpearl_llm.
pe_hidden_channels: 256
pe_num_layers: 2
num_samples: 40
k_pe: 2
probe_distribution: gaussian
m_test: 128
max_gather_rows: 2000000
fixed_seed_mode: false
fixed_seed_value: 0
# Readout fed downstream: "mean" = E_q[Φ(q)] (additive-injection arches);
# composite_graph_gt overrides this to "second_moment". pe_center_moment centers the
# second moment into a covariance.
pe_readout: mean
pe_center_moment: true
# Node input features: "random" = PEARL random probes; "word_embeddings" = mean
# word-embedding of the node-name tokens (deterministic). gt_llm REQUIRES word_embeddings.
pe_node_features: random
