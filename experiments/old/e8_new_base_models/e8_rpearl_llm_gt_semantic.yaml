name: e8
architecture: rpearl_gt_llm
wandb_project: GREP-PRISM
wandb_run_name: e8_rpearl_llm_gt_semantic
wandb_tag: e8_new_base_models
checkpoint_dir: outputs/e8_new_base_models
data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
val_data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
eval_data: data/revised/gen/nav100_n30_gemma_data/split/test_graphs/data_gen_023.json
base_model: google/gemma-4-12B-it
bit4: true
per_device_train_batch_size: 1
learning_rate: 0.0002
epochs: 2
r: 16
debug: true
dataset_proportion: 1.0
max_seq_length: 8192
text_edge_list: present
# Graph Transformer + R-PEARL params (depth held equal to idx 10 for a clean A/B)
d_model: 1024
gt_num_layers: 2
gt_heads: 8
pe_hidden_channels: 256
pe_num_layers: 2
num_samples: 40
dropout: 0.1
k_pe: 2
k_gt: 2
eps: 1e-6
use_layer_norm: true
freeze_llm: false
device: -1
# Semantic R-PEARL input: replace the random probes with a deterministic per-node feature
# = mean LLM word-embedding of that node's name tokens (one GNN pass, no probe averaging).
# Otherwise IDENTICAL to idx 10 (unfrozen + RMSNorm + cold-start) — a one-variable A/B
# (random -> word_embeddings). num_samples is unused in this mode.
pe_node_features: word_embeddings
use_pe_norm: true
pe_gain_init: 0.0
