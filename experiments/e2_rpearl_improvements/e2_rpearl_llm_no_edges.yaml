name: e2
architecture: rpearl_llm
wandb_project: GREP-PRISM
wandb_run_name: e2_rpearl_newdata_no_edges
wandb_tag: e2_rpearl_improvements
checkpoint_dir: outputs/e2_rpearl_improvements_no_edges
data: data/eval/gpt_gen_formatted.json
#base_model: meta-llama/Llama-3.2-3B-Instruct
base_model: meta-llama/Llama-3.1-8B-Instruct
bit4: true
per_device_train_batch_size: 1
learning_rate: 0.0002
epochs: 2
r: 16
debug: true
dataset_proportion: 1.0
max_seq_length: 2048
text_edge_list: none
# R-PEARL GNN params
d_model: 1024
pe_hidden_channels: 256
pe_num_layers: 5
num_samples: 40
dropout: 0.1
k_pe: 3
eps: 1e-6
use_layer_norm: true
freeze_llm: false
device: -1
