# e9 multistage training — STAGE 1: SFT the LLM (LoRA), edges in text, PE frozen.
#
# Pure SFT for a single epoch. The PE module is structurally present (rpearl_llm) but
# FROZEN at init and gated off (gnn.pe_gain_init=0), so it contributes nothing and trains
# nothing — this stage only fits the LoRA adapter to the SPINE style. The saved adapter is
# carried into Stage 2 via `trainer.init_lora_from`.
#
#   python -m prism.training.train_v3 --config-name=e9_ms_stage1
defaults:
  - base_config
  - _self_

name: e9_ms_s1
wandb:
  run_name: e9_ms_stage1_sft
trainer:
  # Stage-1 freeze regime: train ONLY the LoRA; PE stays inert.
  freeze_pe: true
