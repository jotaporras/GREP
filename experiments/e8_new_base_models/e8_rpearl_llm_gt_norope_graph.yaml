name: e8
architecture: rpearl_gt_llm
wandb_project: GREP-PRISM
wandb_run_name: e8_rpearl_llm_gt_norope_graph
wandb_tag: e8_new_base_models
checkpoint_dir: outputs/e8_new_base_models
data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
val_data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
eval_data: data/revised/gen/nav100_n30_gemma_data/split/test_graphs/data_gen_023.json
base_model: google/gemma-4-12B-it
bit4: true
per_device_train_batch_size: 1
learning_rate: 0.0002
epochs: 2
r: 16
debug: true
dataset_proportion: 1.0
max_seq_length: 8192
text_edge_list: present
# Graph Transformer + R-PEARL params
d_model: 1024
gt_num_layers: 2
gt_heads: 8
pe_hidden_channels: 256
pe_num_layers: 2
num_samples: 40
dropout: 0.1
k_pe: 2
k_gt: 2
eps: 1e-6
use_layer_norm: true
freeze_llm: false
device: -1
# One change from e8_rpearl_llm_gt_pegain0: disable RoPE on graph (node-name) token
# spans (position_id 0 -> identity rotation). pe_gain stays 0 (Ψ off, GNN dormant), so
# this isolates the pure effect of removing sequential position from node names on the
# base LLM. A later run will raise pe_gain so Ψ supplies the position RoPE no longer does.
pe_gain_init: 0.0
disable_graph_token_rope: true
