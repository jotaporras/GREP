name: e8
architecture: gt_llm
wandb_project: GREP-PRISM
wandb_run_name: e8_gt_llm_no_edges_L5_d4096
wandb_tag: e8_new_base_models
checkpoint_dir: outputs/e8_new_base_models
data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
val_data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
eval_data: data/revised/gen/nav100_n30_gemma_data/split/test_graphs/data_gen_023.json
base_model: google/gemma-4-12B-it
bit4: true
per_device_train_batch_size: 1
learning_rate: 0.0002
epochs: 2
r: 16
debug: true
dataset_proportion: 1.0
max_seq_length: 8192
text_edge_list: none
# gt_llm_no_edges GT-WIDTH sweep at L=5, d_model=4096 (vs idx 18 = L5/d1024). Pure semantic
# Graph Transformer over word-embedding node features — NO R-PEARL. Only d_model changes
# across the d1024/d2048/d3072/d4096 sweep; depth (L=5), heads=8, k_gt=1, no edge list,
# RMSNorm and cold-start are held fixed. head_dim = d_model/8. ~519M trainable GT params.
d_model: 4096
gt_num_layers: 5
gt_heads: 8
k_gt: 1
dropout: 0.1
freeze_llm: false
device: -1
pe_node_features: word_embeddings   # required by gt_llm (the GT has no probe fallback)
use_pe_norm: true
pe_gain_init: 0.0
