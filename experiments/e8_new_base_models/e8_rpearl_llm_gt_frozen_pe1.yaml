name: e8
architecture: rpearl_gt_llm
wandb_project: GREP-PRISM
wandb_run_name: e8_rpearl_llm_gt_frozen_pe1
wandb_tag: e8_new_base_models
checkpoint_dir: outputs/e8_new_base_models
data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__train.json
val_data: data/revised/gen/nav100_n30_gemma_data/split/formatted_all_new__val.json
eval_data: data/revised/gen/nav100_n30_gemma_data/split/test_graphs/data_gen_023.json
base_model: google/gemma-4-12B-it
# bit4 disabled for this probe: with freeze_llm=true there is no LoRA adapter, and HF's
# Trainer refuses to train a purely-quantized model ("cannot fine-tune purely quantized
# models ... attach trainable adapters"). Our trainable params are the structural PE path
# (outside the LLM), which the guard doesn't see. A frozen 12B in bf16 (~24GB) fits the
# B200 easily and avoids quant noise in the frozen base.
bit4: false
per_device_train_batch_size: 1
learning_rate: 0.0002
epochs: 2
r: 16
debug: true
dataset_proportion: 1.0
max_seq_length: 8192
text_edge_list: present
# Graph Transformer + R-PEARL params
d_model: 1024
gt_num_layers: 2
gt_heads: 8
pe_hidden_channels: 256
pe_num_layers: 2
num_samples: 40
dropout: 0.1
k_pe: 2
k_gt: 2
eps: 1e-6
use_layer_norm: true
device: -1
# Probe: is the PE informative at all? Freeze the LLM (no LoRA — peft is disabled when
# freeze_llm=true) so the ONLY trainable path is the structural PE (R-PEARL/GT + pe_proj
# + pe_gain), and force the injection fully on (pe_gain_init=1.0). RoPE stays normal (no
# graph-token disable) so this isn't confounded with the norope line. If train loss drops,
# the PE can carry task signal; if it stays stuck, the PE genuinely isn't informative.
freeze_llm: true
pe_gain_init: 1.0
