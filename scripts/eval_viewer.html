<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRISM Eval Rollout Viewer</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel2: #2d2d30; --border: #3e3e42;
    --fg: #d4d4d4; --muted: #858585; --accent: #4ec9b0; --user: #569cd6;
    --asst: #ce9178; --warn: #f48771; --ok: #6a9955; --pass: #4ec9b0;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--fg); font-size:13px; }
  header { padding:10px 16px; background:var(--panel2); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; color:var(--accent); }
  .stats { font-size:12px; color:var(--muted); }
  .stats b { color:var(--fg); }
  .layout { display:flex; height:calc(100vh - 49px); }
  .sidebar { width:300px; border-right:1px solid var(--border); overflow-y:auto;
    background:var(--panel); flex-shrink:0; }
  .ex-item { padding:8px 12px; border-bottom:1px solid var(--border); cursor:pointer; }
  .ex-item:hover { background:var(--panel2); }
  .ex-item.active { background:#094771; }
  .ex-item .task-text { white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-size:12px; margin-bottom:3px; }
  .badges { display:flex; gap:4px; flex-wrap:wrap; }
  .badge { font-size:10px; padding:1px 6px; border-radius:3px; font-weight:600; }
  .badge.pass { background:var(--ok); color:#fff; }
  .badge.fail { background:var(--warn); color:#fff; }
  .badge.fmt-ok { background:#2a4a6b; color:var(--user); }
  .badge.fmt-fail { background:#4a2020; color:var(--warn); }
  .badge.turns { background:var(--border); color:var(--fg); }
  .main { flex:1; overflow-y:auto; padding:16px 20px; }
  .controls { display:flex; gap:8px; align-items:center; margin-bottom:14px; }
  button { background:var(--panel2); color:var(--fg); border:1px solid var(--border);
    padding:4px 12px; border-radius:4px; cursor:pointer; font-size:12px; }
  button:hover { background:var(--border); }
  button:disabled { opacity:.4; cursor:default; }
  input[type=number] { background:var(--panel); color:var(--fg); border:1px solid var(--border);
    padding:4px 8px; border-radius:4px; font-size:12px; width:70px; }
  .sample-header { background:var(--panel2); border:1px solid var(--border);
    border-radius:6px; padding:12px 14px; margin-bottom:12px; }
  .sample-header .task { font-size:14px; font-weight:600; margin-bottom:6px; }
  .sample-header .meta { display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    font-size:12px; color:var(--muted); }
  .sample-header .answer-key { font-family:monospace; color:var(--accent); font-size:12px; }
  .iter { border:1px solid var(--border); border-radius:6px; margin-bottom:10px; overflow:hidden; }
  .iter-head { padding:6px 12px; font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:.5px; background:var(--panel2); display:flex; align-items:center; gap:10px;
    cursor:pointer; user-select:none; }
  .iter-head .iter-num { color:var(--accent); }
  .iter-head .iter-actions { color:var(--muted); font-weight:400; font-size:11px; }
  .iter-body { padding:12px; display:flex; flex-direction:column; gap:10px; }
  .section { }
  .sec-label { color:var(--accent); font-size:11px; text-transform:uppercase;
    letter-spacing:.5px; margin-bottom:4px; }
  pre { background:var(--panel); border:1px solid var(--border); border-radius:4px;
    padding:8px 10px; margin:0; white-space:pre-wrap; word-break:break-word;
    font-size:12px; font-family:ui-monospace,monospace; max-height:300px; overflow-y:auto; }
  .response-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:900px) { .response-grid { grid-template-columns:1fr; } }
  .field { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:8px 10px; }
  .field-label { color:var(--accent); font-size:10px; text-transform:uppercase;
    letter-spacing:.5px; margin-bottom:3px; }
  .field-val { white-space:pre-wrap; word-break:break-word; font-size:12px; line-height:1.5; }
  .plan-step { font-family:ui-monospace,monospace; background:var(--panel2);
    border:1px solid var(--border); border-radius:4px; padding:4px 8px; margin-bottom:3px;
    font-size:12px; }
  .plan-step .act { color:var(--accent); }
  .plan-step.answer .act { color:var(--asst); }
  .actions-executed { display:flex; flex-wrap:wrap; gap:6px; }
  .action-chip { background:var(--panel2); border:1px solid var(--border); border-radius:12px;
    padding:3px 10px; font-family:ui-monospace,monospace; font-size:11px; }
  .action-chip .act { color:var(--accent); }
  .action-chip.answer .act { color:var(--asst); }
  .env-feedback { background:var(--panel); border:1px solid var(--ok); border-radius:4px;
    padding:8px 10px; font-size:12px; white-space:pre-wrap; word-break:break-word;
    color:#b5d5a8; }
  .env-feedback.empty { border-color:var(--border); color:var(--muted); font-style:italic; }
  .collapsed .iter-body { display:none; }
  .empty { color:var(--muted); padding:40px; text-align:center; }
  .verdict { padding:10px 14px; border-radius:6px; margin-bottom:12px; font-size:12px; }
  .verdict.pass { background:#1a3a1a; border:1px solid var(--ok); color:#8fcc8f; }
  .verdict.fail { background:#3a1a1a; border:1px solid var(--warn); color:#cc8f8f; }
</style>
</head>
<body>
<header>
  <h1>PRISM Eval Rollout Viewer</h1>
  <input type="file" id="file" accept=".json" />
  <span class="stats" id="stats">No eval log loaded</span>
</header>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <div class="empty">Load an eval results JSON file to begin.<br/><br/>
      Supports the <code>{samples: [{interaction_trace: [...]}]}</code> format
      produced by <code>eval_checkpoint_on_graphs.py</code>.</div>
  </div>
</div>
<script>
let DATA = [];
let CUR = -1;
const $ = id => document.getElementById(id);

$('file').addEventListener('change', e => {
  const r = new FileReader();
  r.onload = () => {
    try { load(JSON.parse(r.result), e.target.files[0].name); }
    catch(ex) { alert('Failed to parse JSON: ' + ex.message); }
  };
  r.readAsText(e.target.files[0]);
});

function load(parsed, name) {
  DATA = parsed.samples || (Array.isArray(parsed) ? parsed : []);
  const nc = DATA.filter(s => s.correct).length;
  const nf = DATA.filter(s => s.formatted).length;
  $('stats').innerHTML =
    `<b>${name}</b> &nbsp; ${DATA.length} samples &nbsp; ` +
    `correct: <b style="color:var(--pass)">${nc}/${DATA.length}</b> &nbsp; ` +
    `formatted: <b>${nf}/${DATA.length}</b>`;
  renderSidebar();
  show(0);
}

function renderSidebar() {
  $('sidebar').innerHTML = '';
  DATA.forEach((s, i) => {
    const turns = (s.interaction_trace || []).length;
    const d = document.createElement('div');
    d.className = 'ex-item';
    d.dataset.idx = i;
    d.innerHTML = `
      <div class="task-text">${escapeHtml(s.task)}</div>
      <div class="badges">
        <span class="badge ${s.correct ? 'pass' : 'fail'}">${s.correct ? 'PASS' : 'FAIL'}</span>
        <span class="badge ${s.formatted ? 'fmt-ok' : 'fmt-fail'}">${s.formatted ? 'formatted' : 'bad format'}</span>
        <span class="badge turns">${turns} turn${turns !== 1 ? 's' : ''}</span>
      </div>`;
    d.onclick = () => show(i);
    $('sidebar').appendChild(d);
  });
}

function show(i) {
  if (i < 0 || i >= DATA.length) return;
  CUR = i;
  [...$('sidebar').children].forEach(c => c.classList.toggle('active', +c.dataset.idx === i));
  $('sidebar').querySelector('.ex-item.active')?.scrollIntoView({block:'nearest'});

  const s = DATA[i];
  const trace = s.interaction_trace || [];

  let html = `<div class="controls">
    <button onclick="show(${i-1})" ${i===0?'disabled':''}>← Prev</button>
    <button onclick="show(${i+1})" ${i===DATA.length-1?'disabled':''}>Next →</button>
    <input type="number" value="${i}" min="0" max="${DATA.length-1}" onchange="show(+this.value)" />
    <span class="stats">sample ${i} / ${DATA.length-1}</span>
  </div>`;

  // Sample header
  html += `<div class="sample-header">
    <div class="task">${escapeHtml(s.task)}</div>
    <div class="meta">
      <span>answer key: <span class="answer-key">${escapeHtml(s.answer_key || '')}</span></span>
      <span>terminated by: <b>${escapeHtml(s.terminated_by || '—')}</b></span>
      ${s.error ? `<span style="color:var(--warn)">error: ${escapeHtml(s.error)}</span>` : ''}
    </div>
  </div>`;

  // Verdict
  const vclass = s.correct ? 'pass' : 'fail';
  html += `<div class="verdict ${vclass}">
    ${s.correct ? '✓ CORRECT' : '✗ INCORRECT'} &nbsp;·&nbsp;
    formatted: ${s.formatted ? 'yes' : 'no'} &nbsp;·&nbsp;
    plan keyword match: ${s.plan_keyword ? 'yes' : 'no'}
  </div>`;

  // Interaction trace
  trace.forEach((step, ti) => {
    const actions = step.actions_executed || [];
    const actionSummary = actions.map(a => Array.isArray(a) ? `${a[0]}(${String(a[1]).slice(0,30)})` : JSON.stringify(a)).join(', ');
    const hasFeedback = step.environment_feedback && step.environment_feedback.trim();

    html += `<div class="iter" id="iter-${i}-${ti}">
      <div class="iter-head" onclick="toggleIter('iter-${i}-${ti}')">
        <span class="iter-num">Iteration ${ti}</span>
        <span class="iter-actions">${escapeHtml(actionSummary || '(no actions)')}</span>
      </div>
      <div class="iter-body">`;

    // Planner input
    html += `<div class="section">
      <div class="sec-label">planner input</div>
      <pre>${escapeHtml(step.planner_input || '')}</pre>
    </div>`;

    // Planner response
    const resp = step.planner_response || {};
    if (Object.keys(resp).length) {
      html += `<div class="section"><div class="sec-label">planner response</div>
        <div class="response-grid">`;
      if (resp.primary_goal) html += field('primary_goal', resp.primary_goal);
      if (resp.relevant_graph) html += field('relevant_graph', resp.relevant_graph);
      html += `</div>`;
      if (resp.reasoning) html += `<div style="margin-top:8px">${field('reasoning', resp.reasoning)}</div>`;
      if (resp.plan) {
        html += `<div style="margin-top:8px"><div class="field-label sec-label">plan</div>`;
        const plan = Array.isArray(resp.plan) ? resp.plan : [resp.plan];
        plan.forEach(step => {
          const act = Array.isArray(step) ? step[0] : (step.action || step);
          const arg = Array.isArray(step) ? step[1] : (step.node || step.arg || step.region || step.object || '');
          html += `<div class="plan-step ${act === 'answer' ? 'answer' : ''}">
            <span class="act">${escapeHtml(String(act))}</span>( ${escapeHtml(String(arg))} )</div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    } else {
      html += `<div class="section"><div class="sec-label">planner response</div>
        <pre style="color:var(--warn)">(empty — parsing failed)</pre></div>`;
    }

    // Actions executed
    if (actions.length) {
      html += `<div class="section"><div class="sec-label">actions executed</div>
        <div class="actions-executed">`;
      actions.forEach(a => {
        const act = Array.isArray(a) ? a[0] : (a.action || '?');
        const arg = Array.isArray(a) ? a[1] : (a.node || a.arg || a.region || '');
        html += `<div class="action-chip ${act === 'answer' ? 'answer' : ''}">
          <span class="act">${escapeHtml(String(act))}</span>( ${escapeHtml(String(arg))} )</div>`;
      });
      html += `</div></div>`;
    }

    // Environment feedback
    html += `<div class="section"><div class="sec-label">environment feedback</div>
      <div class="env-feedback ${hasFeedback ? '' : 'empty'}">${
        hasFeedback ? escapeHtml(step.environment_feedback) : '(none — terminal step)'
      }</div></div>`;

    html += `</div></div>`; // iter-body, iter
  });

  if (!trace.length) {
    html += `<div class="empty" style="padding:20px">No interaction trace recorded.</div>`;
  }

  $('main').innerHTML = html;
}

function field(label, val) {
  const s = typeof val === 'string' ? val : JSON.stringify(val, null, 2);
  return `<div class="field"><div class="field-label">${label}</div>
    <div class="field-val">${escapeHtml(s)}</div></div>`;
}

function toggleIter(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') show(CUR - 1);
  if (e.key === 'ArrowRight') show(CUR + 1);
});
</script>
</body>
</html>
