[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10.0,<2.11.0",
    "torchvision>=0.25.0,<0.26.0",
    "torch-geometric>=2.7.0,<2.8.0",
    "torchao>=0.14.0,<0.15.0",
    "transformers>=5.0.0,<5.1.0",
    "peft>=0.18.0,<0.19.0",
    "trl>=0.27.0,<0.28.0",
    "unsloth",
    "unsloth_zoo",
    "datasets",
    "accelerate",
    "safetensors",
    "sentencepiece",
    "tokenizers",
    "numpy",
    "tqdm",
    "wandb",
    "openai",
    "bitsandbytes",
    "tiktoken",
    "scipy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]
